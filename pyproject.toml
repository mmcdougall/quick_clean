[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cache-canary"
version = "0.1.0"
description = "Find pathological macOS cache fanout without expensive full-tree traversal."
readme = "README.md"
requires-python = ">=3.9"
authors = [
  { name = "Cache Canary contributors" }
]
license = { text = "0BSD" }
keywords = ["macos", "cache", "filesystem", "diagnostics", "fanout"]
classifiers = [
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: System :: Filesystems",
  "Topic :: Utilities"
]

[project.urls]
Homepage = "https://github.com/mmcdougall/cache-canary"
Repository = "https://github.com/mmcdougall/cache-canary"
Issues = "https://github.com/mmcdougall/cache-canary/issues"

[project.scripts]
cache-canary = "cachecanary.cli:main"
cachecanary = "cachecanary.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
